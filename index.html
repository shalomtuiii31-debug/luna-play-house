<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#7fd6ff">
<link rel="manifest" href="manifest.json">
<title>Luna's Play House</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#7fd6ff;font-family:system-ui,sans-serif;touch-action:none;overscroll-behavior:none}
#app{position:fixed;inset:0;overflow:hidden}
.screen{position:absolute;inset:0;display:none;overflow:hidden}
.screen.on{display:block}
.btn{position:absolute;border:0;border-radius:50%;background:#fff;box-shadow:0 6px 0 rgba(0,0,0,.18),0 10px 20px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;font-size:44px;cursor:pointer;touch-action:manipulation}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
#home{top:max(12px,env(safe-area-inset-top));left:12px;width:76px;height:76px;z-index:50;font-size:42px;background:#ffd23f}
.sky{background:linear-gradient(#7fd6ff,#d9f4ff)}
/* hub */
#hub{background:radial-gradient(circle at 20% 15%,#fff7a8 0,#ffd8f0 30%,#bfe9ff 70%)}
#hub h1{position:absolute;left:0;right:0;top:4%;text-align:center;margin:0;font-size:clamp(34px,9vw,60px);color:#ff5fa2;text-shadow:0 4px 0 #fff,0 8px 14px rgba(0,0,0,.15);letter-spacing:1px;pointer-events:none}
.tiles{position:absolute;left:5%;right:5%;top:16%;bottom:4%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:4vmin}
.tile{border-radius:36px;box-shadow:0 8px 0 rgba(0,0,0,.18),0 14px 24px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;cursor:pointer;touch-action:manipulation}
.tile:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.tile svg{width:86%;height:86%}
.t1{background:linear-gradient(#ffb3d9,#ff7ab8)}.t2{background:linear-gradient(#ffe27a,#ffb347)}
.t3{background:linear-gradient(#9be7ff,#4cc3ff)}.t4{background:linear-gradient(#c9a7ff,#8f6bff)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.tile{animation:bob 2.6s ease-in-out infinite}.t2{animation-delay:.3s}.t3{animation-delay:.6s}.t4{animation-delay:.9s}
.hand{position:absolute;font-size:74px;z-index:60;pointer-events:none;animation:tapme 1.1s ease-in-out infinite;filter:drop-shadow(0 6px 4px rgba(0,0,0,.3))}
@keyframes tapme{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-8px,-26px) scale(.9)}}
/* shared stage */
.stage{position:absolute;inset:0}
.bgsvg{position:absolute;inset:0;width:100%;height:100%}
.tray{position:absolute;left:0;right:0;bottom:0;height:22%;background:rgba(255,255,255,.88);border-radius:36px 36px 0 0;box-shadow:0 -6px 20px rgba(0,0,0,.15);z-index:20;display:flex;flex-direction:column;padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.tabs{display:flex;gap:8px;justify-content:center;margin-bottom:6px}
.tab{flex:0 0 auto;width:60px;height:60px;border-radius:20px;background:#eef;border:4px solid transparent;font-size:32px;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
.tab.on{background:#ffe27a;border-color:#ff9f1c}
.items{flex:1;display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;align-items:center;padding:0 4px;touch-action:pan-x}
.item{flex:0 0 auto;height:100%;aspect-ratio:1;max-height:110px;border-radius:24px;background:#fff;border:4px solid #ddd;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
.item.on{border-color:#ff5fa2;background:#fff0f7}
.item svg{width:90%;height:90%}
.swatches{position:absolute;right:10px;top:90px;display:flex;flex-direction:column;gap:10px;z-index:15}
.sw{width:52px;height:52px;border-radius:50%;border:5px solid #fff;box-shadow:0 4px 8px rgba(0,0,0,.25);touch-action:manipulation}
.species{position:absolute;left:0;right:0;top:max(12px,env(safe-area-inset-top));display:flex;gap:10px;justify-content:center;z-index:12;padding-left:90px;padding-right:70px}
.sp{width:64px;height:64px;border-radius:50%;background:#fff;border:5px solid #fff;box-shadow:0 5px 10px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;font-size:34px;touch-action:manipulation}
.sp.on{border-color:#ff5fa2}
#charwrap{position:absolute;left:50%;top:14%;height:62%;aspect-ratio:300/420;transform:translateX(-50%);touch-action:none}
#charwrap svg{width:100%;height:100%;overflow:visible}
.jig{animation:jig .5s}
@keyframes jig{0%,100%{transform:translateX(-50%) rotate(0)}25%{transform:translateX(-50%) rotate(-6deg) scale(1.05)}75%{transform:translateX(-50%) rotate(6deg) scale(1.05)}}
/* house */
.rooms{position:absolute;left:0;right:0;top:max(12px,env(safe-area-inset-top));display:flex;gap:10px;justify-content:center;z-index:12;padding-left:90px;padding-right:12px}
.rm{width:62px;height:62px;border-radius:20px;background:#fff;border:5px solid #fff;box-shadow:0 5px 10px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;font-size:32px;touch-action:manipulation}
.rm.on{border-color:#ff5fa2;background:#fff0f7}
.toy{position:absolute;font-size:clamp(52px,14vw,86px);line-height:1;touch-action:none;cursor:grab;filter:drop-shadow(0 6px 4px rgba(0,0,0,.25));z-index:10}
.toy.drag{z-index:30;transform:scale(1.18);filter:drop-shadow(0 14px 8px rgba(0,0,0,.3))}
.pet{position:absolute;font-size:clamp(64px,17vw,100px);z-index:9;transition:left 2.5s ease-in-out,top 2.5s ease-in-out;touch-action:manipulation}
.pet.hop{animation:hop .5s}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-40px) rotate(-10deg)}}
#tidy{right:12px;top:max(12px,env(safe-area-inset-top));width:76px;height:76px;font-size:40px;background:#9be7ff;z-index:50}
/* trucks */
.veh{position:absolute;width:clamp(150px,42vw,230px);touch-action:none;z-index:10;filter:drop-shadow(0 8px 4px rgba(0,0,0,.25))}
.veh svg{width:100%;overflow:visible}
.veh.drag{z-index:30}
.shake{animation:shake .6s}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-6px,-10px) rotate(-3deg)}50%{transform:translate(6px,-14px) rotate(3deg)}80%{transform:translate(-4px,-6px)}}
.drop{animation:dropd 1s}
#arm{transform-origin:68px 62px;transition:transform .5s}
.spray{position:absolute;width:16px;height:16px;border-radius:50%;background:#7fd6ff;border:3px solid #fff;pointer-events:none;z-index:40}
/* bubbles */
.bub{position:absolute;border-radius:50%;background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.95) 0,rgba(255,255,255,.35) 18%,rgba(160,220,255,.25) 60%,rgba(255,150,230,.35) 100%);border:3px solid rgba(255,255,255,.8);box-shadow:inset 0 0 18px rgba(255,255,255,.7),0 6px 14px rgba(0,100,200,.18);display:flex;align-items:center;justify-content:center;touch-action:manipulation}
.bub span{pointer-events:none}
.sparkle{position:absolute;width:14px;height:14px;border-radius:50%;pointer-events:none;z-index:40}
.bgbub{pointer-events:none;opacity:.55}
</style>
</head>
<body>
<div id="app">

<!-- HUB -->
<div class="screen on" id="hub">
  <div id="hubbub" class="stage" style="pointer-events:none"></div>
  <h1>Luna's Play House</h1>
  <div class="tiles">
    <div class="tile t1" data-go="dress"><svg viewBox="0 0 300 300"><use href="#hubDress"/></svg></div>
    <div class="tile t2" data-go="house"><svg viewBox="0 0 300 300"><use href="#hubHouse"/></svg></div>
    <div class="tile t3" data-go="trucks"><svg viewBox="0 0 300 300"><use href="#hubTruck"/></svg></div>
    <div class="tile t4" data-go="bubbles"><svg viewBox="0 0 300 300"><use href="#hubBub"/></svg></div>

</div>

<!-- DRESS UP -->
<div class="screen" id="dress">
  <svg class="bgsvg" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice">
    <defs><linearGradient id="dg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd8f0"/><stop offset="1" stop-color="#bfe9ff"/></linearGradient></defs>
    <rect width="400" height="800" fill="url(#dg)"/>

</div>

<!-- HOUSE -->
<div class="screen" id="house">
  <svg class="bgsvg" id="roombg" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice"></svg>
  <div class="rooms" id="rooms"></div>
  <div id="toys" class="stage"></div>
  <div class="btn" id="tidy">🧹</div>
</div>

<!-- TRUCKS -->
<div class="screen" id="trucks">
  <svg class="bgsvg" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice">
    <defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fd6ff"/><stop offset="1" stop-color="#e4f8ff"/></linearGradient></defs>
    <rect width="400" height="800" fill="url(#tg)"/>
    <circle cx="320" cy="110" r="52" fill="#ffe27a"/>
    <g fill="#fff"><ellipse cx="90" cy="130" rx="60" ry="22"/><ellipse cx="125" cy="112" rx="34" ry="20"/><ellipse cx="260" cy="230" rx="52" ry="18"/></g>
    <path d="M0 360 Q100 290 200 350 T400 330 V800 H0Z" fill="#8fe3a0"/>
    <path d="M0 440 Q120 400 240 440 T400 430 V800 H0Z" fill="#6ed08a"/>
    <rect y="560" width="400" height="120" fill="#6b6f7a"/>
    <g fill="#fff"><rect x="10" y="615" width="50" height="10" rx="5"/><rect x="100" y="615" width="50" height="10" rx="5"/><rect x="190" y="615" width="50" height="10" rx="5"/><rect x="280" y="615" width="50" height="10" rx="5"/><rect x="370" y="615" width="50" height="10" rx="5"/></g>
    <path d="M0 680 H400 V800 H0Z" fill="#b8845a"/>
    <g fill="#9a6a44"><circle cx="60" cy="730" r="20"/><circle cx="330" cy="760" r="26"/><circle cx="200" cy="715" r="14"/></g>
  </svg>
  <div id="vehs" class="stage"></div>
</div>

<!-- BUBBLES -->
<div class="screen sky" id="bubbles"><div id="bubfield" class="stage"></div></div>

<div class="btn" id="home" style="display:none">🏠</div>
</div>

<!-- hidden art defs -->
<svg width="0" height="0" style="position:absolute">
<defs>

    <circle cx="118" cy="140" r="24" fill="#fff"/><circle cx="182" cy="140" r="24" fill="#fff"/><circle cx="122" cy="142" r="11" fill="#222"/><circle cx="178" cy="142" r="11" fill="#222"/>

    <rect x="46" y="118" width="120" height="14" rx="7" fill="#ffd23f"/><rect x="56" y="104" width="100" height="10" rx="5" fill="#ffd23f"/>
    <rect x="38" y="160" width="100" height="10" rx="5" fill="#ffd23f"/>
    <circle cx="90" cy="236" r="30" fill="#333"/><circle cx="90" cy="236" r="14" fill="#ccc"/><circle cx="215" cy="236" r="30" fill="#333"/><circle cx="215" cy="236" r="14" fill="#ccc"/>

    <text x="110" y="156" font-size="78" text-anchor="middle">🐶</text>

    <text x="210" y="218" font-size="60" text-anchor="middle">🚒</text>
    <circle cx="205" cy="70" r="42" fill="#ecfff0" opacity=".85" stroke="#fff" stroke-width="5"/>
    <text x="205" y="88" font-size="44" text-anchor="middle">👾</text>
  </g>
</defs>
</svg>

<script>
'use strict';
/* ---------- tiny sound engine (no files, no internet) ---------- */
let AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } if(AC&&AC.state==='suspended')AC.resume(); return AC; }
function tone(f,t,d,type='sine',vol=.25,slide){
  const a=ac(); if(!a)return;
  const o=a.createOscillator(),g=a.createGain(); o.type=type; o.frequency.setValueAtTime(f,a.currentTime+t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),a.currentTime+t+d);
  g.gain.setValueAtTime(0,a.currentTime+t); g.gain.linearRampToValueAtTime(vol,a.currentTime+t+.02);
  g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t+d);
  o.connect(g); g.connect(a.destination); o.start(a.currentTime+t); o.stop(a.currentTime+t+d+.05);
}
const SND={
  pop(){ tone(500+Math.random()*400,0,.12,'sine',.3,120); },
  boing(){ tone(300,0,.25,'sine',.3,700); tone(700,.2,.15,'sine',.2,400); },
  tada(){ [523,659,784,1047].forEach((f,i)=>tone(f,i*.09,.25,'triangle',.25)); },
  tap(){ tone(700,0,.08,'triangle',.2); },
  honk(){ tone(220,0,.3,'square',.15); tone(277,0,.3,'square',.12); },
  siren(){ for(let i=0;i<6;i++) tone(i%2?620:880,i*.25,.25,'sawtooth',.12); },
  roar(){ tone(120,0,.6,'sawtooth',.25,50); tone(90,.05,.6,'square',.15,40); },
  splash(){ for(let i=0;i<5;i++) tone(1200-i*120,i*.05,.12,'sine',.12); },
  dig(){ tone(150,0,.15,'square',.15,90); tone(160,.2,.15,'square',.15,90); tone(130,.4,.25,'sawtooth',.15,80); },
  animal(k){ const m={dog:[400,250],cat:[800,500],bunny:[900,1100],monster:[110,80],kid:[600,800]}[k]||[500,400]; tone(m[0],0,.18,'square',.18,m[1]); tone(m[1],.2,.18,'square',.15,m[0]); },
  swoosh(){ tone(900,0,.2,'sine',.15,200); }
};

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const svgNS='http://www.w3.org/2000/svg';
function sparkle(x,y,n=8,colors=['#ffd23f','#ff5fa2','#7fd6ff','#9be7a0','#c9a7ff']){
  const app=$('#app');
  for(let i=0;i<n;i++){
    const s=document.createElement('div'); s.className='sparkle'; s.style.background=colors[i%colors.length];
    s.style.left=x+'px'; s.style.top=y+'px'; app.appendChild(s);
    const ang=Math.random()*6.28, d=40+Math.random()*60;
    s.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${Math.cos(ang)*d}px,${Math.sin(ang)*d}px) scale(.2)`,opacity:0}],{duration:600+Math.random()*300,easing:'ease-out'}).onfinish=()=>s.remove();
  }
}
function drag(el,{onStart,onMove,onEnd,onTap,bounds}={}){
  let sx,sy,ox,oy,moved=false,id=null;
  el.addEventListener('pointerdown',e=>{
    if(id!==null)return;
    ac(); id=e.pointerId; try{el.setPointerCapture(id);}catch(_){} moved=false;
    sx=e.clientX; sy=e.clientY; ox=el.offsetLeft; oy=el.offsetTop; el.classList.add('drag'); onStart&&onStart(e); e.preventDefault();
  });
  el.addEventListener('pointermove',e=>{
    if(id!==e.pointerId)return;
    const dx=e.clientX-sx, dy=e.clientY-sy;
    if(Math.abs(dx)+Math.abs(dy)>8)moved=true;
    if(moved){
      const p=el.parentElement.getBoundingClientRect();
      let nx=ox+dx, ny=oy+dy;
      nx=Math.max(-10,Math.min(p.width-el.offsetWidth+10,nx)); ny=Math.max(0,Math.min(p.height-el.offsetHeight*0.6,ny));
      el.style.left=nx+'px'; el.style.top=ny+'px'; onMove&&onMove(e);
    }
  });
  const end=e=>{
    if(id!==e.pointerId)return; id=null; el.classList.remove('drag');
    if(!moved)onTap&&onTap(e); else onEnd&&onEnd(e);
  };
  el.addEventListener('pointerup',end); el.addEventListener('pointercancel',end);
}

/* ---------- gentle hints: a bobbing finger shows what to touch, goes away on the first touch ---------- */
const hinted={};
function hint(screen,x,y){
  if(hinted[screen])return; hinted[screen]=1;
  const h=document.createElement('div'); h.className='hand'; h.textContent='👆'; h.style.left=x+'px'; h.style.top=y+'px'; $('#'+screen).appendChild(h);
  const kill=()=>{h.remove();document.removeEventListener('pointerdown',kill,true);}; setTimeout(()=>document.addEventListener('pointerdown',kill,true),400); setTimeout(kill,9000);
}
/* ---------- navigation ---------- */
let cur='hub';
function go(name){
  $$('.screen').forEach(s=>s.classList.toggle('on',s.id===name)); cur=name;
  $('#home').style.display=name==='hub'?'none':'flex';
  if(name==='dress')initDress(); if(name==='house')initHouse(); if(name==='trucks')initTrucks(); if(name==='bubbles')initBubbles();
  SND.tap();
  const W=innerWidth,H=innerHeight;
  if(name==='hub')hint('hub',W*.22,H*.30);
  if(name==='dress')hint('dress',W*.5,H*.84);
  if(name==='house')hint('house',W*.3,H*.7);
  if(name==='trucks')hint('trucks',W*.22,H*.2);
  if(name==='bubbles')hint('bubbles',W*.45,H*.55);
}
$$('.tile').forEach(t=>t.addEventListener('pointerdown',e=>{e.preventDefault();ac();go(t.dataset.go);}));
$('#home').addEventListener('pointerdown',e=>{e.preventDefault();go('hub');});

/* ---------- hub background bubbles ---------- */
(function(){
  const f=$('#hubbub');
  function mk(){
    const b=document.createElement('div'); b.className='bub bgbub'; const s=30+Math.random()*60;
    b.style.cssText+=`width:${s}px;height:${s}px;left:${Math.random()*100}%;bottom:-80px`; f.appendChild(b);
    b.animate([{transform:'translateY(0)'},{transform:`translateY(-${window.innerHeight+120}px) translateX(${(Math.random()-.5)*80}px)`}],{duration:9000+Math.random()*7000,easing:'linear'}).onfinish=()=>{b.remove();};
  }
  setInterval(()=>{ if(cur==='hub')mk(); },900); for(let i=0;i<6;i++)setTimeout(mk,i*250);
})();

/* ================= DRESS UP ================= */
const SPECIES=[
  {k:'monster',icon:'👾',body:'#6fc3ff',name:'monster'},
  {k:'bunny',icon:'🐰',body:'#ffd9ec',name:'bunny'},
  {k:'cat',icon:'🐱',body:'#ffb347',name:'cat'},
  {k:'dog',icon:'🐶',body:'#d9a066',name:'dog'},
  {k:'kid',icon:'🧒',body:'#ffd6a8',name:'kid'}
];

function thumb(cat,it){

function renderTray(){
  const all=[]; TABS.forEach(([k])=>ITEMS[k].forEach(it=>all.push([k,it])));

  $('#items').innerHTML=all.map(([k,it])=>`<div class="item ${dState.wear[k]===it.id?'on':''}" data-k="${k}" data-i="${it.id}" style="border-color:${dState.wear[k]===it.id?'#ff5fa2':col[k]}">${thumb(k,it)}</div>`).join('');
  $$('#items .item').forEach(t=>t.addEventListener('pointerdown',e=>{
    const c=t.dataset.k,id=t.dataset.i; ac();
    dState.wear[c]=dState.wear[c]===id?null:id; SND.tada(); const r=t.getBoundingClientRect(); sparkle(r.left+r.width/2,r.top,10);
    renderChar(); renderTray();
  }));
}

    $('#rooms').innerHTML=ROOMS.map((r,i)=>`<div class="rm ${i===0?'on':''}" data-r="${i}">${r.icon}</div>`).join('');
    $$('.rm').forEach(b=>b.addEventListener('pointerdown',()=>{SND.swoosh();hState.room=+b.dataset.r;$$('.rm').forEach(x=>x.classList.toggle('on',x===b));loadRoom();}));
    $('#tidy').addEventListener('pointerdown',tidy);
  }

function loadRoom(){
  const R=ROOMS[hState.room]; $('#roombg').innerHTML=R.bg;
  const box=$('#toys'); box.innerHTML=''; clearInterval(petTimer);
  const W=window.innerWidth,H=window.innerHeight;
  const saved=hState.placed[R.k]||{};
  R.toys.forEach((e,i)=>{
    const t=document.createElement('div'); t.className='toy'; t.textContent=e;
    const p=saved[i]||{x:Math.random()*(W-120)+20,y:H*0.55+Math.random()*H*0.35};
    t.style.left=p.x+'px'; t.style.top=p.y+'px'; box.appendChild(t);
    drag(t,{onEnd:()=>{(hState.placed[R.k]=hState.placed[R.k]||{})[i]={x:t.offsetLeft,y:t.offsetTop};SND.pop();sparkle(t.offsetLeft+t.offsetWidth/2,t.offsetTop+10,6);},
            onTap:()=>{SND.boing();t.animate([{transform:'scale(1)'},{transform:'scale(1.3) rotate(-8deg)'},{transform:'scale(1)'}],{duration:350});sparkle(t.offsetLeft+t.offsetWidth/2,t.offsetTop+20,8);}});
  });
  const pet=document.createElement('div'); pet.className='pet'; pet.textContent=R.pet; pet.style.left='40%'; pet.style.top=(H*0.30)+'px'; box.appendChild(pet);
  pet.addEventListener('pointerdown',e=>{ac();SND.animal(R.pet==='🐶'?'dog':R.pet==='🐱'?'cat':'bunny');pet.classList.remove('hop');void pet.offsetWidth;pet.classList.add('hop');sparkle(e.clientX,e.clientY,10);e.preventDefault();});
  petTimer=setInterval(()=>{ if(cur!=='house')return; pet.style.left=(10+Math.random()*60)+'%'; pet.style.top=(H*0.22+Math.random()*H*0.18)+'px'; },3000);
}
function tidy(){
  ac(); SND.tada(); const R=ROOMS[hState.room], box=$('#toys'); const toys=[...box.querySelectorAll('.toy')];
  const W=window.innerWidth,H=window.innerHeight, cols=4, cw=W/cols; hState.placed[R.k]={};
  toys.forEach((t,i)=>{
    const x=(i%cols)*cw+cw/2-t.offsetWidth/2, y=H*0.62+Math.floor(i/cols)*(t.offsetHeight+18);
    t.animate([{left:t.style.left,top:t.style.top},{left:x+'px',top:y+'px'}],{duration:700,easing:'cubic-bezier(.3,1.5,.5,1)',delay:i*60,fill:'forwards'}).onfinish=()=>{t.style.left=x+'px';t.style.top=y+'px';sparkle(x+t.offsetWidth/2,y+20,5);};
    hState.placed[R.k][i]={x,y};
  });
}

 fire:{svg:`<svg viewBox="0 0 260 150"><rect x="8" y="48" width="150" height="62" rx="10" fill="#e82020"/><rect x="150" y="62" width="92" height="48" rx="12" fill="#e82020"/><path d="M162 68h46l26 26h-72z" fill="#bdeaff"/><rect x="18" y="34" width="120" height="10" rx="5" fill="#ffd23f"/><rect x="26" y="22" width="104" height="8" rx="4" fill="#ffd23f"/><path d="M26 22 L80 6 L134 22" stroke="#ffd23f" stroke-width="5" fill="none"/><rect x="18" y="66" width="104" height="9" rx="4" fill="#ffd23f"/><rect x="176" y="48" width="28" height="12" rx="6" fill="#4cc3ff"/><circle cx="54" cy="116" r="24" fill="#333"/><circle cx="54" cy="116" r="11" fill="#ccc"/><circle cx="186" cy="116" r="24" fill="#333"/><circle cx="186" cy="116" r="11" fill="#ccc"/><circle cx="236" cy="96" r="6" fill="#ffd23f"/></svg>`,snd:'siren'},
 dump:{svg:`<svg viewBox="0 0 260 150"><g id="bed"><path d="M10 40 H138 L148 100 H0Z" fill="#ffb300" stroke="#e08800" stroke-width="5" stroke-linejoin="round"/><path d="M28 52h96M24 74h104" stroke="#ffd966" stroke-width="7" stroke-linecap="round"/></g><rect x="138" y="62" width="104" height="48" rx="12" fill="#ffb300"/><path d="M158 68h44l26 24h-70z" fill="#bdeaff"/><rect x="0" y="100" width="150" height="14" rx="5" fill="#555"/><circle cx="52" cy="116" r="24" fill="#333"/><circle cx="52" cy="116" r="11" fill="#ccc"/><circle cx="188" cy="116" r="24" fill="#333"/><circle cx="188" cy="116" r="11" fill="#ccc"/></svg>`,snd:'honk'},
 dig:{svg:`<svg viewBox="0 0 260 150"><rect x="20" y="104" width="150" height="26" rx="13" fill="#444"/><circle cx="36" cy="117" r="9" fill="#777"/><circle cx="154" cy="117" r="9" fill="#777"/><rect x="40" y="62" width="100" height="44" rx="10" fill="#ff9f1c"/><rect x="50" y="34" width="52" height="34" rx="8" fill="#ff9f1c"/><rect x="58" y="40" width="36" height="22" rx="4" fill="#bdeaff"/><g id="arm"><path d="M110 70 L190 20 L212 36 L136 90Z" fill="#ff9f1c" stroke="#e08000" stroke-width="3"/><path d="M190 20 L236 34 L228 88" stroke="#e08000" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M222 80 Q252 82 248 108 H212 Q214 88 222 80Z" fill="#6b6f7a"/></g></svg>`,snd:'dig'},
 monster:{svg:`<svg viewBox="0 0 260 150"><path d="M30 76 H210 L222 100 H18Z" fill="#6ed08a"/><path d="M70 76 L92 38 H158 L184 76Z" fill="#6ed08a"/><path d="M98 44h26v28H84zM130 44h22l16 28h-38z" fill="#bdeaff"/><rect x="14" y="94" width="232" height="14" rx="7" fill="#2d9d57"/><circle cx="62" cy="108" r="36" fill="#222"/><circle cx="62" cy="108" r="20" fill="#bbb"/><circle cx="198" cy="108" r="36" fill="#222"/><circle cx="198" cy="108" r="20" fill="#bbb"/><circle cx="108" cy="62" r="7" fill="#fff"/><circle cx="108" cy="62" r="3" fill="#000"/><path d="M200 80 l8 -14 l8 14z M18 84 l-8 -12 l12 4z" fill="#ffd23f"/></svg>`,snd:'roar'}
};
let tInit=false;
function initTrucks(){
  const box=$('#vehs');
  if(tInit)return; tInit=true; const W=window.innerWidth,H=window.innerHeight;
  const spots={fire:[.04,.12],dump:[.5,.30],dig:[.02,.50],monster:[.46,.62]};
  Object.entries(VEH).forEach(([k,v])=>{
    const el=document.createElement('div'); el.className='veh'; el.innerHTML=v.svg;
    el.style.left=(spots[k][0]*W)+'px'; el.style.top=(spots[k][1]*H)+'px'; box.appendChild(el);
    drag(el,{onEnd:()=>SND.swoosh(),onTap:e=>act(k,el,e)});
  });
}
function act(k,el,e){
  ac(); SND[VEH[k].snd]();
  const r=el.getBoundingClientRect();
  if(k==='fire'){
    for(let i=0;i<14;i++){const s=document.createElement('div');s.className='spray';s.style.left=(r.left+r.width*.12)+'px';s.style.top=(r.top+r.height*.1)+'px';$('#app').appendChild(s);
      s.animate([{transform:'translate(0,0)',opacity:1},{transform:`translate(${-30-Math.random()*90}px,${-60-Math.random()*70}px)`,opacity:.9,offset:.5},{transform:`translate(${-80-Math.random()*130}px,${80+Math.random()*60}px)`,opacity:0}],{duration:1100,delay:i*40}).onfinish=()=>s.remove();}
    el.animate([{transform:'translateX(0)'},{transform:'translateX(14px)'},{transform:'translateX(-14px)'},{transform:'translateX(0)'}],{duration:500});
  }else if(k==='dump'){
    const bed=el.querySelector('#bed'); bed.animate([{transform:'rotate(0)'},{transform:'rotate(-22deg)'},{transform:'rotate(-22deg)'},{transform:'rotate(0)'}],{duration:1400,transformOrigin:'0 110px'});
    for(let i=0;i<8;i++)sparkle(r.left+10+Math.random()*30,r.top+r.height*.7,1,['#9a6a44']);
  }else if(k==='dig'){
    const a=el.querySelector('#arm'); a.animate([{transform:'rotate(0)'},{transform:'rotate(28deg)'},{transform:'rotate(-14deg)'},{transform:'rotate(0)'}],{duration:1200,transformOrigin:'110px 70px'});
    setTimeout(()=>sparkle(r.left+r.width*.9,r.top+r.height*.7,8,['#9a6a44','#b8845a']),500);
  }else if(k==='monster'){
    el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake'); sparkle(r.left+r.width/2,r.top+10,12);
  }
}

/* ================= BUBBLES ================= */
const BUBE=['🐶','🐱','🐘','🦁','🐸','🐰','🐼','🦆','🐠','🚒','🚜','🚚','🏗️','🚓','👾','🦖','🐙','🦄'];
let bTimer=null,bInit=false;
function initBubbles(){
  const f=$('#bubfield'); if(bInit){for(let i=0;i<5;i++)window.__spawn&&window.__spawn(.15+i*.15);return;} bInit=true;
  function spawn(startFrac=0){
    if(cur!=='bubbles'||f.childElementCount>11)return;
    const s=90+Math.random()*70, b=document.createElement('div'); b.className='bub';
    b.style.width=b.style.height=s+'px'; b.style.left=Math.random()*(window.innerWidth-s)+'px'; b.style.top=window.innerHeight+'px';
    const sp=document.createElement('span'); sp.style.fontSize=(s*.55)+'px'; sp.textContent=BUBE[Math.floor(Math.random()*BUBE.length)]; b.appendChild(sp); f.appendChild(b);
    const dur=7000+Math.random()*5000, sway=(Math.random()-.5)*120;
    const an=b.animate([{transform:'translate(0,0)'},{transform:`translate(${sway}px,-${window.innerHeight+s+40}px)`}],{duration:dur,easing:'linear'});
    an.currentTime=startFrac*dur; an.onfinish=()=>b.remove();
    b.addEventListener('pointerdown',e=>{ac();e.preventDefault();pop(b,sp.textContent,an);});
  }
  function pop(b,emo,an){
    const r=b.getBoundingClientRect(); an.cancel(); b.remove(); SND.pop(); sparkle(r.left+r.width/2,r.top+r.height/2,14);
    const a=document.createElement('div'); a.textContent=emo; a.style.cssText=`position:absolute;left:${r.left}px;top:${r.top}px;font-size:${r.width*.6}px;z-index:30;pointer-events:none`; f.appendChild(a);
    a.animate([{transform:'translateY(0) scale(1)',opacity:1},{transform:'translateY(-70px) scale(1.5)',opacity:0}],{duration:700}).onfinish=()=>a.remove();
    if(/🚒|🚜|🚚|🏗️|🚓/.test(emo))setTimeout(SND.honk,80); else if(/👾|🦖/.test(emo))setTimeout(SND.roar,80); else setTimeout(()=>SND.animal('dog'),80);
  }
  window.__spawn=spawn; bTimer=setInterval(()=>spawn(0),650); for(let i=0;i<7;i++)spawn(.12+i*.1);
}
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('gesturestart',e=>e.preventDefault());
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
setTimeout(()=>hint('hub',innerWidth*.22,innerHeight*.30),600);
</script>
